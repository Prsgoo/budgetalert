services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"

  rabbitmq:
    image: rabbitmq:3-management
    profiles: ["rabbitmq"]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"

  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    profiles: ["azureservicebus"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123!"

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    profiles: ["azureservicebus"]
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "Password123!"
    ports:
      - "5672:5672"
    depends_on:
      - sqledge

  api:
    build:
      context: .
      dockerfile: src/BudgetAlert.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Server=sqlserver;Database=BudgetAlert;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      RabbitMq__Host: "rabbitmq"
    depends_on:
      - sqlserver

  worker:
    build:
      context: .
      dockerfile: workers/BudgetAlert.Worker/Dockerfile
    environment:
      ConnectionStrings__Default: "Server=sqlserver;Database=BudgetAlert;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      RabbitMq__Host: "rabbitmq"
    depends_on:
      - sqlserver
